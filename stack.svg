<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#f5a3ff"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#25205c"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94a3b8" opacity=".12"/></pattern>
 <style>
 .t{font:700 12px ui-monospace,monospace;letter-spacing:3px;fill:#22d3ee}.h{font:700 28px Arial,sans-serif;fill:#f8fafc}
 .cat{font:700 10px ui-monospace,monospace;letter-spacing:2px;fill:#94a3b8}.txt{font:600 12px Arial,sans-serif;fill:#e2e8f0}
 .node{fill:#121625;stroke:#334155}.small{font:700 9px ui-monospace,monospace}
 </style>
</defs>
<rect width="1200" height="560" fill="#0d0e16"/>
<rect x="20" y="20" width="1160" height="520" rx="26" fill="#10131f" stroke="url(#edge)" stroke-width="1.4"/>
<rect x="20" y="20" width="1160" height="520" rx="26" fill="url(#dots)"/>
<text x="55" y="65" class="t">// TECH STACK</text><text x="55" y="101" class="h">My engineering stack</text>

<!-- network -->
<g transform="translate(305 300)">
 <circle r="105" fill="#8b5cf6" opacity=".08" filter="url(#blur)"/>
 <g stroke="#38bdf8" stroke-opacity=".28" fill="none">
  <path d="M0 0 Q-80 -80 -170 -120"/><path d="M0 0 Q-100 -30 -190 -30"/><path d="M0 0 Q-100 35 -185 65"/>
  <path d="M0 0 Q-65 95 -125 145"/><path d="M0 0 Q80 -95 165 -140"/><path d="M0 0 Q105 -35 195 -35"/>
  <path d="M0 0 Q105 35 195 60"/><path d="M0 0 Q75 100 135 145"/>
 </g>
 <circle r="54" fill="url(#core)" stroke="#c084fc" stroke-width="1.5"/>
 <text x="-27" y="6" font-family="Arial" font-size="22" font-weight="800" fill="#fff">&lt;/&gt;</text>
 <text x="-35" y="78" class="cat">CORE STACK</text>

 <g transform="translate(-170 -120)"><circle r="25" fill="#111827" stroke="#f59e0b" stroke-opacity=".75"/><text text-anchor="middle" y="4" class="small" fill="#f59e0b">Java</text></g><g transform="translate(-190 -30)"><circle r="25" fill="#111827" stroke="#3b82f6" stroke-opacity=".75"/><text text-anchor="middle" y="4" class="small" fill="#3b82f6">Python</text></g><g transform="translate(-185 65)"><circle r="25" fill="#111827" stroke="#facc15" stroke-opacity=".75"/><text text-anchor="middle" y="4" class="small" fill="#facc15">JavaScript</text></g><g transform="translate(-125 145)"><circle r="25" fill="#111827" stroke="#22d3ee" stroke-opacity=".75"/><text text-anchor="middle" y="4" class="small" fill="#22d3ee">React</text></g><g transform="translate(165 -140)"><circle r="25" fill="#111827" stroke="#22c55e" stroke-opacity=".75"/><text text-anchor="middle" y="4" class="small" fill="#22c55e">Spring</text></g><g transform="translate(195 -35)"><circle r="25" fill="#111827" stroke="#e2e8f0" stroke-opacity=".75"/><text text-anchor="middle" y="4" class="small" fill="#e2e8f0">Next.js</text></g><g transform="translate(195 60)"><circle r="25" fill="#111827" stroke="#60a5fa" stroke-opacity=".75"/><text text-anchor="middle" y="4" class="small" fill="#60a5fa">SQL</text></g><g transform="translate(135 145)"><circle r="25" fill="#111827" stroke="#f97316" stroke-opacity=".75"/><text text-anchor="middle" y="4" class="small" fill="#f97316">Git</text></g>
 <g opacity=".8">
  <circle r="58" fill="none" stroke="#a78bfa" stroke-opacity=".55"><animate attributeName="r" values="58;75;58" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="3s" repeatCount="indefinite"/></circle>
 </g>
</g>

<!-- right side skill map -->
<g transform="translate(565 130)">
 <rect x="0" y="0" width="560" height="350" rx="20" fill="#0d111c" stroke="#263044"/>
 <text x="28" y="32" class="cat">STACK MAP</text>
 <text x="28" y="58" class="txt" opacity=".7">Existing skills from my profile — no additions</text>

 <g transform="translate(28 82)">
  <rect width="504" height="52" rx="13" class="node"/><rect width="4" height="52" rx="2" fill="#22d3ee"/>
  <text x="20" y="19" class="cat">LANGUAGES</text><text x="20" y="40" class="txt">Java · Python · JavaScript · C++ · HTML · CSS</text>
 </g>
 <g transform="translate(28 146)">
  <rect width="504" height="52" rx="13" class="node"/><rect width="4" height="52" rx="2" fill="#a78bfa"/>
  <text x="20" y="19" class="cat">FRONTEND</text><text x="20" y="40" class="txt">React · Next.js · Tailwind · Bootstrap</text>
 </g>
 <g transform="translate(28 210)">
  <rect width="504" height="52" rx="13" class="node"/><rect width="4" height="52" rx="2" fill="#facc15"/>
  <text x="20" y="19" class="cat">BACKEND &amp; DATABASES</text><text x="20" y="40" class="txt">Spring · MongoDB · MySQL · PostgreSQL</text>
 </g>
 <g transform="translate(28 274)">
  <rect width="504" height="52" rx="13" class="node"/><rect width="4" height="52" rx="2" fill="#f472b6"/>
  <text x="20" y="19" class="cat">CLOUD, DEVOPS &amp; TOOLING</text><text x="20" y="40" class="txt">Git · GitHub · IntelliJ IDEA · VS Code</text>
 </g>
</g>
</svg>